[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grood"
version = "0.1.0"
description = "GrooD - a pseudobulk-trained gradient boosting model for bulk transcriptome deconvolution"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "Maik Wolfram-Schauerte", email = "maik.wolfram-schauerte@uni-tuebingen.de" }
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "joblib>=1.4",
  "anndata>=0.10",
  "matplotlib>=3.9",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "seaborn>=0.13",
  "tqdm>=4.67",
  "shap>=0.48",
  "scanpy>=1.10",
  "statannotations>=0.7",
  "xgboost>=3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff",
  "build",
  "twine"
]

[project.scripts]
grood = "grood.cli:main"

[project.urls]
Homepage = "https://github.com/MaikTungsten/GrooD"
Repository = "https://github.com/MaikTungsten/GrooD"
Issues = "https://github.com/MaikTungsten/GrooD/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grood = ["data/*.tsv"]